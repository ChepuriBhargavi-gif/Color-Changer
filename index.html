<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>COLOR CHANGER</h1>

    <div class="buttons">

    <button onclick = "colorChanger('red');">Red</button>
    
    <button onclick = "colorChanger('blue')">Blue</button>
    
    <button onclick = "colorChanger('green')">Green</button>
    
    <button onclick = "colorChanger('magenta')">Magenta</button>
    
    <button onclick = "colorChanger('goldenrod')">Golden Rod</button>

    <button onclick = "colorChanger('white')">Reset</button>

    </div>

    <div id = "box"></div>

    <script src = "script.js"></script>
    
</body>
</html>
